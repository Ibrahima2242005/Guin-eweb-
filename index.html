<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkUp</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-polyfill@9.0.0/dist/umd/polyfill.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding-bottom: 70px; }
    
    /* Header */
    header { background: #00875a; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; font-weight: bold; font-size: 1.2rem; }
    
    /* Container */
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }

    /* Sections / Tabs */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Formulaire Publication */
    .post-box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .post-box textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; resize: none; height: 80px; outline: none; }
    .post-box button { background: #00875a; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; margin-top: 10px; }

    /* Cards Publications */
    .post-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 40px; height: 40px; background: #00875a; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-info h4 { font-size: 0.95rem; }
    .user-info span { font-size: 0.8rem; color: #666; }
    .post-content { font-size: 0.95rem; line-height: 1.4; margin-bottom: 10px; }
    
    /* Bottom Navigation */
    nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
    .nav-btn { background: none; border: none; color: #666; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 25%; }
    .nav-btn.active { color: #00875a; font-weight: bold; }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Empty State */
    .empty-state { text-align: center; color: #777; margin-top: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>LinkUp</header>

  <div class="container">
    
    <!-- ONGLET ACCUEIL -->
    <section id="tab-home" class="tab-content active">
      <div class="post-box">
        <textarea id="postInput" placeholder="Exprimez-vous..."></textarea>
        <button onclick="createPost()">Publier</button>
        <div style="clear:both;"></div>
      </div>
      
      <div id="postsFeed">
        <div class="empty-state">Chargement du fil d'actualité...</div>
      </div>
    </section>

    <!-- ONGLET EXPLORER -->
    <section id="tab-explore" class="tab-content">
      <h3>Explorer</h3>
      <div class="empty-state">Découvrez de nouveaux membres et tendances bientôt ici.</div>
    </section>

    <!-- ONGLET MESSAGES -->
    <section id="tab-messages" class="tab-content">
      <h3>Messages</h3>
      <div class="empty-state">Aucune discussion en cours.</div>
    </section>

    <!-- ONGLET PROFIL -->
    <section id="tab-profile" class="tab-content">
      <h3>Mon Profil</h3>
      <div id="profileDetails" class="empty-state">Chargement de votre profil...</div>
    </section>

  </div>

  <!-- NAVIGATION BAS -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-home', this)">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Accueil
    </button>
    <button class="nav-btn" onclick="switchTab('tab-explore', this)">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Explorer
    </button>
    <button class="nav-btn" onclick="switchTab('tab-messages', this)">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Messages
    </button>
    <button class="nav-btn" onclick="switchTab('tab-profile', this)">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Profil
    </button>
  </nav>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = 'https://TON-PROJET.supabase.co';
    const SUPABASE_KEY = 'TA-CLE-ANON-PUBLIC';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. Navigation entre onglets
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');

      if (tabId === 'tab-home') fetchPosts();
      if (tabId === 'tab-profile') fetchProfile();
    }

    // 2. Charger les publications depuis Supabase
    async function fetchPosts() {
      const feed = document.getElementById('postsFeed');
      
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select('*, profiles(full_name, username)')
        .order('created_at', { ascending: false });

      if (error) {
        feed.innerHTML = '<div class="empty-state">Erreur lors de la récupération des messages.</div>';
        return;
      }

      if (!posts || posts.length === 0) {
        feed.innerHTML = '<div class="empty-state">Aucune publication pour le moment. Soyez le premier à publier !</div>';
        return;
      }

      feed.innerHTML = posts.map(post => `
        <div class="post-card">
          <div class="post-header">
            <div class="avatar">${(post.profiles?.full_name || 'U')[0].toUpperCase()}</div>
            <div class="user-info">
              <h4>${post.profiles?.full_name || 'Membre LinkUp'}</h4>
              <span>@${post.profiles?.username || 'utilisateur'}</span>
            </div>
          </div>
          <div class="post-content">${post.content}</div>
        </div>
      `).join('');
    }

    // 3. Publier un nouveau message
    async function createPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();

      if (!text) return alert('Veuillez écrire un texte avant de publier.');

      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        alert('Vous devez être connecté pour publier.');
        return;
      }

      const { error } = await supabaseClient
        .from('posts')
        .insert([{ content: text, user_id: user.id }]);

      if (error) {
        alert('Erreur de publication: ' + error.message);
      } else {
        input.value = '';
        fetchPosts();
      }
    }

    // 4. Charger les données du profil
    async function fetchProfile() {
      const profileBox = document.getElementById('profileDetails');
      const { data: { user } } = await supabaseClient.auth.getUser();

      if (!user) {
        profileBox.innerHTML = '<p class="empty-state">Non connecté.</p>';
        return;
      }

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', user.id)
        .single();

      profileBox.innerHTML = `
        <div style="background:white; padding:20px; border-radius:10px; text-align:center;">
          <div class="avatar" style="width:60px; height:60px; font-size:1.5rem; margin:0 auto 10px;">${(profile?.full_name || 'U')[0]}</div>
          <h3>${profile?.full_name || 'Utilisateur'}</h3>
          <p style="color:#666;">@${profile?.username || 'pseudo'}</p>
          <p style="color:#888; font-size:0.85rem; margin-top:5px;">${user.email}</p>
        </div>
      `;
    }

    // Chargement initial
    window.onload = () => {
      fetchPosts();
    };
  </script>
</body>
</html>
